name: Publish tested VST3 package
on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'releases/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify archived package and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git describe --tags --abbrev=0)"
          fi
          cd "releases/$version"
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          archive = Path('JerzyCloneCollection-Win64.zip')
          lines = Path('SHA256SUMS.txt').read_text().splitlines()
          expected = next(line.split()[0] for line in lines if line.endswith('  ' + archive.name))
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              name = 'JerzyCloneCollection.vst3/Contents/x86_64-win/JerzyCloneCollection.vst3'
              expected_binary = next(line.split()[0] for line in lines if line.endswith('  ' + name))
              assert hashlib.sha256(z.read(name)).hexdigest() == expected_binary
          PY
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $version already exists"
            exit 0
          fi
          gh release create "$version" JerzyCloneCollection-Win64.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Jerzy Clone Collection $version — Windows x64 VST3 prototype" \
            --notes-file ../../docs/RELEASE_NOTES.md
